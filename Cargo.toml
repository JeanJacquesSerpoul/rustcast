[package]
name = "rustcast-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/JeanJacquesSerpoul/rustcast"

[dependencies]
shared = { path = "shared" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "HtmlAudioElement", "HtmlMediaElement", "HtmlInputElement", "HtmlElement", "Element",
  "Event", "KeyboardEvent", "MouseEvent", "Window", "Document", "DomRect", "Storage",
  "TimeRanges", "Node",
] }

[workspace]
members = ["src-tauri", "shared"]
