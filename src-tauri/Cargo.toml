[package]
name = "rustcast"
version = "0.1.2"
description = "RustCast — gestionnaire de podcasts"
edition = "2021"
license = "MIT"
repository = "https://github.com/JeanJacquesSerpoul/rustcast"

[lib]
name = "rustcast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shared = { path = "../shared" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "sync", "time", "macros"] }
futures-util = "0.3"
rss = "2"
ammonia = "4"
chrono = "0.4"
sha1_smol = "1"
quick-xml = "0.37"
anyhow = "1"
urlencoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
